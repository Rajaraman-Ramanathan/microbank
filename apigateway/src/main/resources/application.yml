server:
  port: 8123

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

      routes:
        - id: transaction-service
          uri: lb://transaction-service
          predicates:
            - Path=/transaction-service/api/v1/transactions/**
          filters:
            - StripPrefix=1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: disabled
        # issuer-uri: http://keycloak:8080/realms/microbank
        # jwk-set-uri: http://keycloak:8080/realms/microbank/protocol/openid-connect/certs


eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

