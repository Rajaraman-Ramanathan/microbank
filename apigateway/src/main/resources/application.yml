server:
  port: 8123

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/microbank
          jwk-set-uri: http://keycloak:8080/realms/microbank/protocol/openid-connect/certs


eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

